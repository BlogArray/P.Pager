name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SourceLink / deterministic builds

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore P.Pager.sln

      - name: Build
        run: dotnet build P.Pager.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test tests/P.Pager.Tests/P.Pager.Tests.csproj -c Release --no-build --logger "trx"

      - name: Pack
        run: |
          dotnet pack src/P.Pager/P.Pager.csproj -c Release --no-build -o artifacts
          dotnet pack src/P.Pager.Mvc.Core/P.Pager.Mvc.Core.csproj -c Release --no-build -o artifacts
          dotnet pack src/P.Pager.Blazor/P.Pager.Blazor.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

  # Publishes to nuget.org when a tag like v9.0.0 is pushed.
  # Requires a repository secret NUGET_API_KEY (nuget.org > API keys, scoped to the P.Pager* packages).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY secret is not set"; exit 1; fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
